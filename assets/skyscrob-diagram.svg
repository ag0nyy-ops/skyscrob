<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Inter, system-ui, -apple-system, sans-serif">
<rect width="720" height="420" fill="#fafaf9"/>
<text x="14" y="38" font-size="26" font-weight="700" fill="#1c1917" text-anchor="start">How skyscrob works</text><text x="14" y="66" font-size="15" font-weight="400" fill="#78716c" text-anchor="start">Diagram, not a screenshot. Apple Music → Last.fm, from any device.</text><rect x="14" y="90" width="150" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4"/><text x="30" y="120" font-size="15" font-weight="600" fill="#1c1917" text-anchor="start">Your devices</text><text x="30" y="150" font-size="14" font-weight="400" fill="#1c1917" text-anchor="start">iPhone, HomePod,</text><text x="30" y="171" font-size="14" font-weight="400" fill="#1c1917" text-anchor="start">Watch, CarPlay,</text><text x="30" y="192" font-size="14" font-weight="400" fill="#1c1917" text-anchor="start">or Mac</text><text x="30" y="213" font-size="14" font-weight="400" fill="#78716c" text-anchor="start">nothing to install</text><path d="M168 165 H184" stroke="#78716c" stroke-width="1.5"/><path d="M179 161 L186 165 L179 169" fill="none" stroke="#78716c" stroke-width="1.5" stroke-linejoin="round"/><rect x="190" y="90" width="150" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4"/><text x="206" y="120" font-size="15" font-weight="600" fill="#1c1917" text-anchor="start">Apple Music</text><text x="206" y="150" font-size="14" font-weight="400" fill="#1c1917" text-anchor="start">"Recently played"</text><text x="206" y="171" font-size="14" font-weight="400" fill="#1c1917" text-anchor="start">list</text><circle cx="210" cy="208" r="4" fill="#16a34a"/><text x="220" y="213" font-size="14" font-weight="400" fill="#1c1917" text-anchor="start">connected</text><path d="M344 165 H360" stroke="#78716c" stroke-width="1.5"/><path d="M355 161 L362 165 L355 169" fill="none" stroke="#78716c" stroke-width="1.5" stroke-linejoin="round"/><rect x="366" y="90" width="150" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4"/><text x="382" y="120" font-size="15" font-weight="600" fill="#1c1917" text-anchor="start">skyscrob</text><text x="382" y="150" font-size="14" font-weight="400" fill="#1c1917" text-anchor="start">Cloudflare Worker</text><text x="382" y="171" font-size="14" font-weight="400" fill="#1c1917" text-anchor="start">polls every minute</text><text x="382" y="192" font-size="14" font-weight="400" fill="#78716c" text-anchor="start">diffs the list</text><path d="M520 165 H536" stroke="#78716c" stroke-width="1.5"/><path d="M531 161 L538 165 L531 169" fill="none" stroke="#78716c" stroke-width="1.5" stroke-linejoin="round"/><rect x="542" y="90" width="150" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4"/><text x="558" y="120" font-size="15" font-weight="600" fill="#1c1917" text-anchor="start">Last.fm</text><circle cx="562" cy="145" r="4" fill="#d51007"/><text x="572" y="150" font-size="14" font-weight="400" fill="#1c1917" text-anchor="start">now playing</text><text x="558" y="171" font-size="14" font-weight="400" fill="#16a34a" text-anchor="start">scrobbled</text><rect x="14" y="258" width="692" height="148" rx="12" fill="#ffffff" stroke="#e7e5e4"/><text x="30" y="288" font-size="15" font-weight="600" fill="#1c1917" text-anchor="start">When a play is scrobbled</text><text x="30" y="312" font-size="13" font-weight="400" fill="#78716c" text-anchor="start">A new song on top is sent as now playing. It is scrobbled after half the song or 4 minutes,</text><text x="30" y="330" font-size="13" font-weight="400" fill="#78716c" text-anchor="start">and only if your Last.fm history doesn't already have it.</text><path d="M30 346 H690" stroke="#e7e5e4"/><text x="30" y="368" font-size="12" font-weight="400" fill="#1c1917" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{"event":"poll","user":"…","result":"new","planned":1,"skipped":0}</text><text x="30" y="388" font-size="12" font-weight="400" fill="#16a34a" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{"event":"scrobbled","user":"…","sent":1,"ignored":0}</text><text x="690" y="288" font-size="12" font-weight="400" fill="#78716c" text-anchor="end">log format: src/service.ts</text>
</svg>
