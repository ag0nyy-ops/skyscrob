name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc -p tsconfig.test.json --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run secrets:scan
      - name: Worker bundles
        run: npx wrangler deploy --dry-run --outdir dist
